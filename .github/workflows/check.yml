# Runs the site audit on every push and pull request (broken links, alt text,
# titles, descriptions, structured data, redirects). A red X on GitHub means
# something needs fixing before it goes live.
name: Site check
on:
  push:
  pull_request:
# Quick back-to-back pushes cancel the older check instead of piling up in GitHub's queue
concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
