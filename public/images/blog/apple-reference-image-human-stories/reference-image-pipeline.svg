<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">How an Apple Reference Image is made</title>
<desc id="d">Four steps: the sensor signs the pixels, the Secure Enclave signs the camera settings, the phone saves a secure digital negative, and Private Cloud Compute checks everything, develops the photo and signs it.</desc>
<rect width="800" height="560" fill="#ffffff"/>
<text x="40" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#000">How a reference image is made</text>
<line x1="70" y1="130" x2="70" y2="490" stroke="#e2e0dc" stroke-width="4"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
  <circle cx="70" cy="130" r="26" fill="#ff0000"/><text x="70" y="139" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">1</text>
  <text x="120" y="122" font-size="24" font-weight="bold" fill="#000">The sensor signs the pixels</text>
  <text x="120" y="154" font-size="20" fill="#6b6b70">It reboots into a locked mode and seals the raw frame.</text>

  <circle cx="70" cy="250" r="26" fill="#000"/><text x="70" y="259" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">2</text>
  <text x="120" y="242" font-size="24" font-weight="bold" fill="#000">The Secure Enclave signs the settings</text>
  <text x="120" y="274" font-size="20" fill="#6b6b70">Zoom, focal length and timestamps get their own seal.</text>

  <circle cx="70" cy="370" r="26" fill="#000"/><text x="70" y="379" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">3</text>
  <text x="120" y="362" font-size="24" font-weight="bold" fill="#000">The phone saves a digital negative</text>
  <text x="120" y="394" font-size="20" fill="#6b6b70">A DNG file holds the raw pixels and both signatures.</text>

  <circle cx="70" cy="490" r="26" fill="#000"/><text x="70" y="499" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">4</text>
  <text x="120" y="482" font-size="24" font-weight="bold" fill="#000">Apple's cloud checks, develops and signs</text>
  <text x="120" y="514" font-size="20" fill="#6b6b70">Private Cloud Compute verifies it, then makes the JPEG.</text>
</g>
</svg>
