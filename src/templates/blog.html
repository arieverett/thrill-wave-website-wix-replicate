<section class="hero hero--still">
  <div class="bg-video"><img class="bg-video__poster" src="/images/library/camera-operator-blue-haze.webp" alt="" fetchpriority="high"></div>
  <div class="hero__shade" aria-hidden="true"></div>
  <div class="container hero__content">
    <p class="hero__eyebrow">{{eyebrow}}</p>
    <h1 class="hero__stack">{{heading}}</h1>
    <p class="hero__lede">{{intro}}</p>
    {{newsletter}}
  </div>
</section>

<nav class="chip-nav" aria-labelledby="cat-nav-label">
  <div class="container">
    <p class="chip-nav__label" id="cat-nav-label">Select category:</p>
    <ul>{{categories}}</ul>
  </div>
</nav>

<section class="section section--posts">
  <div class="container">
    <div class="post-grid" data-show="9">
{{posts}}
    </div>
  </div>
</section>

{{ender}}
